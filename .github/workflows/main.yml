name: "FAP Build"
on: [push, pull_request, workflow_dispatch]

jobs:
  ufbt-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ufbt & Build
        run: |
          pip install ufbt
          ufbt update
          ufbt

      - name: Upload FAP
        uses: actions/upload-artifact@v4
        with:
          name: fap-build
          path: 'dist/*.fap'
